# Site settings
title: jjvenky — catchment & lake biogeochemistry
email: jason.venkiteswaran@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  catchment and lake biogeochemistry
baseurl: ""
url: https://jjvenky.github.io
github_username:  jjvenky
sticky: true

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.27.3"
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

include:
  - _pages

repository: jjvenky/jjvenky.github.io

author:
  name   : "Jason Venkiteswaran"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : ""
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jjvenky"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-4266Y9F6GN"
    anonymize_ip: false
